<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css) layer(framework);
      @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css") layer(framework);
      @import url(../styles/sul-bs6.css) layer(component);
    </style>
    <script src="../templating/js/page-code.js"></script>
  </head>
  <body class="p-12">
    <main class="container">
      <h1>Buttons</h1>
      <p><span class="badge theme-secondary">Bootstrap 6</span> <a href="bootstrap5.html">View the Bootstrap 5 version</a></p>
      <div class="border rounded p-5 mt-12" style="
        background: repeating-conic-gradient(#eee 0% 25%, transparent 0% 50%)
          50% / 20px 20px;
      ">
        <div class="mb-1">
          <h2>Small</h2>
          <button class="btn-solid theme-primary btn-sm" data-html-target="Small button" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-primary btn-sm" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-solid theme-secondary btn-sm" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-secondary btn-sm" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
        </div>
        <div class="mb-5">
          <button data-html-target="Disabled button" class="btn-solid theme-primary btn-sm" disabled type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-primary btn-sm" disabled type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-solid theme-secondary btn-sm" disabled type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-secondary btn-sm" disabled type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
        </div>
        <div class="mb-5">
          <h2>Default</h2>
          <button data-html-target="Default button" class="btn-solid theme-primary" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-primary" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-solid theme-secondary" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-secondary" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
        </div>
        <div class="mb-5">
          <h2>Large</h2>
          <button data-html-target="Large button" class="btn-solid theme-primary btn-lg" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-primary btn-lg" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-solid theme-secondary btn-lg" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
          <button class="btn-outline theme-secondary btn-lg" type="button">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </button>
        </div>
        <div>
          <h2>Anchors styled like buttons</h2>
          <a data-html-target="Anchors styled like buttons" class="btn-solid theme-primary" href="#">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </a>
          <a class="btn-outline theme-primary" href="#">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </a>
          <a class="btn-solid theme-secondary" href="#">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </a>
          <a class="btn-outline theme-secondary" href="#">
            <i class="bi bi-box-arrow-up-right"></i>Button
          </a>
        </div>
      </div>

      <div class="d-flex align-items-baseline">
        <h2 class="mt-12">HTML</h2>
        <button class="btn-solid theme-primary ms-auto" data-copy-target="" onclick="copyHTML(event)">Copy</button>
      </div>
      <pre>
        <code class="d-block language-html" style="white-space: pre-wrap;">
        </code>
      </pre>
    </main>
  </body>
</html>
