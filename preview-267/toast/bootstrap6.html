<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css) layer(framework);
      @import url(../styles/sul-bs6.css) layer(component);
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="../templating/js/page-code.js"></script>
  </head>
  <body class="p-12">
    <style>
      .toast:not(.show) {
        display: flex;
        opacity: 1;
      }
    </style>
    <h1>Toasts</h1>
    <p><span class="badge theme-secondary">Bootstrap 6</span> <a href="bootstrap5.html">View the Bootstrap 5 version</a></p>
    <h2>Black Toast</h2>
    <div class="toast-container position-relative bottom-0 end-0 p-5" data-html-target="Black toast">
      <div
        class="toast rounded-4"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-body bg-stanford-black fg-white">
          <div class="d-flex">
            <div
              class="bi bi-exclamation-circle-fill fs-2xl me-5 align-self-center d-flex justify-content-center"
            ></div>
            <div>
              <div class="fw-semibold">Alert!</div>
              <div>Toast text</div>
            </div>
            <div class="me-3 m-auto">
              <button
                type="button"
                class="btn-text text-uppercase fg-white"
              >
                Undo
              </button>
              <button
                type="button"
                class="btn-close"
                aria-label="Close"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <h2>Stanford Digital Red Toast</h2>
    <div class="toast-container position-relative bottom-0 end-0 p-5" data-html-target="Stanford Digital Red toast">
      <div
        class="toast rounded-4"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-body bg-stanford-digital-red fg-white">
          <div class="d-flex">
            <div
              class="bi bi-exclamation-triangle-fill fs-2xl me-5 align-self-center d-flex justify-content-center"
            ></div>
            <div>
              <div class="fw-semibold">Alert!</div>
              <div>Toast text</div>
            </div>
            <div class="me-3 m-auto">
              <button
                type="button"
                class="btn-text text-uppercase fg-white"
              >
                Undo
              </button>
              <button
                type="button"
                class="btn-close"
                aria-label="Close"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <h2>Digital Green Toast</h2>
    <div class="toast-container position-relative bottom-0 end-0 p-5" data-html-target="Digital Green toast">
      <div
        class="toast rounded-4"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-body bg-stanford-digital-green fg-white">
          <div class="d-flex">
            <div
              class="bi bi-check-circle-fill fs-2xl me-5 align-self-center d-flex justify-content-center"
            ></div>
            <div>
              <div class="fw-semibold">Alert!</div>
              <div>Toast text</div>
            </div>
            <div class="me-3 m-auto">
              <button
                type="button"
                class="btn-text text-uppercase fg-white"
              >
                Undo
              </button>
              <button
                type="button"
                class="btn-close"
                aria-label="Close"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <h2>Poppy Dark Toast</h2>
    <div class="toast-container position-relative bottom-0 end-0 p-5" data-html-target="Poppy Dark toast">
      <div
        class="toast rounded-4"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-body bg-poppy-dark fg-white">
          <div class="d-flex">
            <div
              class="bi bi-exclamation-circle-fill fs-2xl me-5 align-self-center d-flex justify-content-center"
            ></div>
            <div>
              <div class="fw-semibold">Alert!</div>
              <div>Toast text</div>
            </div>
            <div class="me-3 m-auto">
              <button
                type="button"
                class="btn-text text-uppercase fg-white"
              >
                Undo
              </button>
              <button
                type="button"
                class="btn-close"
                aria-label="Close"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex align-items-baseline">
      <h2 class="mt-12">HTML</h2>
      <button class="btn-solid theme-primary ms-auto" data-copy-target="" onclick="copyHTML(event)">Copy</button>
    </div>
    <pre>
      <code class="d-block language-html" style="white-space: pre-wrap;">
      </code>
    </pre>
  </body>
</html>
