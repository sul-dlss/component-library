<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css) layer(framework);
      @import url(../styles/sul-bs6.css) layer(component);
    </style>
    <script>
      window.addEventListener("load", e => {
        const alert_iframe = document.getElementById('alerts')
        const alert_height = alert_iframe.contentWindow.document.documentElement.scrollHeight;
        alert_iframe.style.height = `${alert_height}px`;
        const d_alert_iframe = document.getElementById('dimissable-alerts');
        const d_alert_height = d_alert_iframe.contentWindow.document.documentElement.scrollHeight;
        d_alert_iframe.style.height = `${d_alert_height}px`;
      });
    </script>
  </head>
  <body class="p-12">
    <main class="container">
      <p><span class="badge theme-secondary">Bootstrap 6</span> <a href="bootstrap5.html">View the Bootstrap 5 version</a></p>
      <iframe
          src="alerts_bootstrap6.html"
          title="alerts"
          style="width: 100%"
          height="100%"
          id="alerts"
        ></iframe>
        <iframe
          src="dimissable_alerts_bootstrap6.html"
          title="dimissable alerts"
          style="width: 100%"
          height="100%"
          id="dimissable-alerts"
        ></iframe>
    </main>
  </body>
</html>
