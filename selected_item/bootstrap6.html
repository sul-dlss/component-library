<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css) layer(framework);
      @import url(../styles/sul-bs6.css) layer(component);
    </style>
    <script src="../templating/js/page-code.js"></script>
  </head>
  <body class="p-7">
    <main class="container">
      <h1>Selected Item</h1>
      <p><span class="badge theme-secondary">Bootstrap 6</span> <a href="bootstrap5.html">View the Bootstrap 5 version</a></p>
      <div class="border rounded p-5 mt-12">
        <ul class="list-unstyled" data-html-target="selected item">
          <li class="d-inline-flex gap-3 align-items-center my-3">
            <span class="bg-1 badge rounded-pill border selected-item">
              <span class="selected-item-label">Pill Label</span>
              <button
                type="button"
                class="btn-close"
                aria-label="Remove XXXXXXX"
              ></button>
            </span>
          </li>
          <li class="d-inline-flex gap-3 align-items-center my-3">
            <span class="bg-1 badge rounded-pill border selected-item">
              <span class="selected-item-label">
                Pill Label 2
              </span>
              <button
                type="button"
                class="btn-close"
                aria-label="Remove XXXXXXX"
              ></button>
            </span>
          </li>
        </ul>
      </div>

      <div class="d-flex align-items-baseline">
        <h2 class="mt-12">HTML</h2>
        <button class="btn-solid theme-primary ms-auto" data-copy-target="" onclick="copyHTML(event)">Copy</button>
      </div>
      <div>Adapted from the default Blacklight 8.3 markup for Bootstrap 6.</div>
      <pre>
        <code class="d-block language-html" style="white-space: pre-wrap;">
        </code>
      </pre>
    </main>
  </body>
</html>
