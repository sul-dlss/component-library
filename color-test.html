<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css) layer(framework);
      @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css") layer(framework);
      @import url(../styles/sul.css) layer(component);
    </style>
    <script src="../templating/js/page-code.js"></script>
  </head>
  <body class="p-5">
    <main class="container">
      <p>
      The success, danger and warning colors don't seem to be aligned, should they be?
      </p>
      <p>
        <em>btn-success</em> vs <em>bg-success</em><br>
        <button class="btn btn-success">Success</button>
        <span class="badge bg-success">Success</span>
      </p>
      <p>
        <em>btn-danger</em> vs <em>bg-danger</em><br>
        <button class="btn btn-danger">Danger</button>
        <span class="badge bg-danger">Danger</span>
      </p>
      <p>
        <em>btn-warning</em> vs <em>bg-warning</em><br>
        <button class="btn btn-warning">Warning</button>
        <span class="badge bg-warning">Warning</span>
      </p>
    </main>
  </body>
</html>
