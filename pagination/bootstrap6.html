<!DOCTYPE html>
<html>
  <head>
    <style>
      @layer framework, component;
      @import url(https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css) layer(framework);
      @import url(../styles/sul-bs6.css) layer(component);

      .palo-alto-dark {
        --bs-dark-rgb: var(--stanford-palo-alto-dark-rgb);
      }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script
      type="module"
      src="https://unpkg.com/@github/auto-complete-element@latest/dist/bundle.js"
    ></script>
  </head>
  <body class="p-12">
    <main class="container">
      <h1>Pagination</h1>
      <p><span class="badge theme-secondary">Bootstrap 6</span> <a href="bootstrap5.html">View the Bootstrap 5 version</a></p>
      <div class="border rounded p-5 mt-12">
        <div class="p-5">
          <nav class="paginate-section" aria-label="pagination links">
            <ul class="pagination">
              <li class="page-item disabled">
                <a
                  rel="prev"
                  onclick="return false;"
                  class="page-link"
                  aria-label="Go to previous page"
                  href="#"
                >« Previous</a>
              </li>
              <li class="page-item active" aria_current="page">
                <a
                  class="page-link"
                  aria-label="Current Page, Page 1"
                  href="/?q=&amp;search_field=all_fields"
                >1</a>
              </li>
              <li class="page-item">
                <a
                  rel="next"
                  class="page-link"
                  aria-label="Go to page 2"
                  href="/?page=2&amp;q=&amp;search_field=all_fields"
                >2</a>
              </li>
              <li class="page-item">
                <a
                  class="page-link"
                  aria-label="Go to page 3"
                  href="/?page=3&amp;q=&amp;search_field=all_fields"
                >3</a>
              </li>
              <li class="page-item">
                <a
                  class="page-link"
                  aria-label="Go to page 4"
                  href="/?page=4&amp;q=&amp;search_field=all_fields"
                >4</a>
              </li>
              <li class="page-item">
                <a
                  class="page-link"
                  aria-label="Go to page 5"
                  href="/?page=5&amp;q=&amp;search_field=all_fields"
                >5</a>
              </li>
              <li class="page-item disabled">
                <span class="page-link">…</span>
              </li>
              <li class="page-item">
                <a
                  class="page-link"
                  aria-label="Go to page 2,947"
                  href="/?page=2947&amp;q=&amp;search_field=all_fields"
                >2,947</a>
              </li>
              <li class="page-item">
                <a
                  class="page-link"
                  aria-label="Go to page 2,948"
                  href="/?page=2948&amp;q=&amp;search_field=all_fields"
                >2,948</a>
              </li>
              <li class="page-item">
                <a
                  rel="next"
                  onclick="return false;"
                  class="page-link"
                  aria-label="Go to next page"
                  href="#"
                >Next »</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </main>
  </body>
</html>
